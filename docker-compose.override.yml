services:
  etl:
    profiles:
      - tools
      - etl
    build:
      context: .
      dockerfile: Dockerfile
    image: presight-etl:latest
    container_name: presight-etl
    user: "0:0"
    environment:
      - DATA_DIR=/app/datasets
      - OUTPUT_DIR=/app/outputs
    volumes:
      - ./outputs:/app/outputs
    networks:
      - presight-net

  airflow-webserver:
    volumes:
      - ./starter_files:/opt/airflow/dags
      - ./solutions/submissions/Akhilesh/03_big_data/3.3_airflow_dag.py:/opt/airflow/dags/3.3_airflow_dag.py
      - ./outputs:/opt/airflow/outputs

  airflow-scheduler:
    volumes:
      - ./starter_files:/opt/airflow/dags
      - ./solutions/submissions/Akhilesh/03_big_data/3.3_airflow_dag.py:/opt/airflow/dags/3.3_airflow_dag.py
      - ./outputs:/opt/airflow/outputs
